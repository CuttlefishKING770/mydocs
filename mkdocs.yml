site_name: LIN个人笔记
site_url: https://cuttlefishking770.github.io/mydocs/

theme:
  name: material
  language: zh # 设置语言为中文
  features:
    - navigation.top   # 顶部导航
    - navigation.tabs  # 顶部标签页样式
    - toc.follow       # 侧边目录自动跟随
    - header.autohide

  # 🎨 颜色配置
  palette:
    primary: blue-grey
    accent: red
    
  # 🖼️ 图标配置
  icon:
    logo: material/robot  # 变成机器人图标

nav:
  - 首页: index.md
  - python OCR相关学习: python_study.md
  - markdown格式: markdown_study.md
  - makdoce学习: mkdocs_study.md


# 扩展插件配置
markdown_extensions:
  - admonition          # 提示块 !!! note
  - pymdownx.details    # 折叠详情 ???
  - pymdownx.tilde      # 删除线 ~~
  - pymdownx.tasklist   # 任务列表 - [ ]
  - pymdownx.snippets   # 导入代码
  - pymdownx.tabbed:    # 标签页
      alternate_style: true

  # 👇👇👇 重点修改这里：合并了 superfences 和 highlight 👇👇👇
  - pymdownx.highlight:
      anchor_linenums: true      # 让行号可以被链接
      
  - pymdownx.superfences:        # 既支持高级代码框，也支持流程图
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # 👆👆👆 修改结束 👆👆👆