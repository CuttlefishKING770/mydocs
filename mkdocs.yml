# ==========================================
# 1. 基础信息设置 (必填)
# ==========================================
site_name: LIN个人笔记              # 浏览器标签页和左上角显示的网站名字
site_url: https://cuttlefishking770.github.io/mydocs/  
# ↑ 你的网站发布后的网址。MkDocs 需要用它来生成正确的链接跳转，
#   如果不填或填错，可能会导致 404 错误。

# ==========================================
# 2. 主题样式设置 (颜值担当)
# ==========================================
theme:
  name: material                   # 指定使用 "Material" 这个第三方主题
  language: zh                     # 界面语言改成中文 (比如搜索框会显示"搜索"而不是"Search")
  
  # --- 功能开关 (Features) ---
  features:
    - navigation.top               # 【回到顶部】网页长的时候，右下角会出现一个小箭头，点一下回顶部
    - navigation.tabs              # 【顶部导航条】把左侧的菜单挪到网页最上方，类似 App 的标签页，适合分类多的时候
    - toc.follow                   # 【目录跟随】右侧的小目录会随着你滚动鼠标自动高亮当前看到的位置
    - header.autohide              # 【自动隐藏顶栏】往下滚动阅读时，顶部的蓝条会自动收起来，给你更大的阅读视野

  # --- 颜色调色盘 (Palette) ---
  palette:
    primary: blue-grey             # 【主色调】网页顶部横条和左侧边栏的颜色
                                   # 可选值: indigo, red, pink, purple, teal, green, black, white 等
    accent: blue                    # 【强调色】链接、按钮、鼠标悬停时的颜色

  # --- 图标设置 (Icon) ---
  icon:
    logo: material/robot           # 【网站Logo】左上角的图标。
                                   # material/robot 是主题自带的。如果要用自己的图，填 assets/logo.png

# ==========================================
# 3. 导航菜单 (Nav)
# ==========================================
# 决定了网页菜单栏显示什么，以及顺序。
# 格式为 -> 显示在网页上的中文名 : docs文件夹里真实的文件名
nav:
  - 首页: index.md                 # 对应 docs/index.md
  - Python OCR相关学习: python_study.md
  - Markdown格式: markdown_study.md
  - MkDocs学习: mkdocs_study.md    # 哪怕文件名拼错了(makdoce)，这里改对就行

# ==========================================
# 4. 插件配置 (Plugins) - ⚠️ 核心修改区
# ==========================================
plugins:
  # 搜索功能 (必须保留)
  - search
  
  # 时间戳功能 (精确到分钟)
  - git-revision-date-localized:
      type: datetime
      locale: zh
      timezone: Asia/Shanghai
      fallback_to_build_date: true
      enable_creation_date: true
      custom_format: "%Y-%m-%d %H:%M"  # 效果: 2026-02-05 20:30

# ==========================================
# 5. Markdown 语法增强
# ==========================================
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.tasklist
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

  # 代码高亮
  - pymdownx.highlight:
      anchor_linenums: true
      
  # 流程图与高级代码框支持
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# ==========================================
# 6. 外部脚本 (Extra JS) - ⚠️ 之前报错是因为这里
# ==========================================
extra_javascript:
  # 🔴 之前你写成了 [链接](...)，YAML不认这种写法
  # 🟢 正确写法如下 (只有网址，没有括号)：
  - https://unpkg.com/mermaid@9.4.0/dist/mermaid.min.js