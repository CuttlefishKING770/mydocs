site_name: 我的个人笔记  # 你可以改成你想要的名字
site_url: https://cuttlefishking770.github.io/mydocs/

theme:
  name: material
  language: zh  # 设置语言为中文
  features:
    - navigation.top   #哪怕网页很长，右下角也会有个“回到顶部”的按钮
    - navigation.tabs  # 顶部的导航栏样式
    - toc.follow       # 右侧目录自动跟随滚动

# 这里是关键的扩展功能配置
markdown_extensions:
  - admonition          # 提示块 (!!! note)
  - pymdownx.details    # 折叠详情 (???)
  - pymdownx.superfences # 强力代码块（支持画图）
  - pymdownx.tilde      # 删除线 (~~)
  - pymdownx.tasklist   # 任务列表 (- [ ])
  - pymdownx.snippets   # 允许导入代码文件
  - pymdownx.tabbed:    # 标签页功能
      alternate_style: true

# 这一步是让 mermaid 画图生效的
extra_javascript:
  - https://unpkg.com/mermaid@9.4.0/dist/mermaid.min.js